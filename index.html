<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#004b35" />
    <title>MAXCARS CASINO</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #004b35;
        }

        body {
            box-sizing: border-box;
            height: 100vh;
            height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                env(safe-area-inset-bottom) env(safe-area-inset-left);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #game {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        #game canvas {
            display: block;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .rotate-hint {
            display: none;
            margin: 0;
            padding: 10px 16px;
            color: #ffffff;
            font: 14px/1.4 Arial, sans-serif;
            text-align: center;
        }

        @media (pointer: coarse) and (orientation: portrait) {
            .rotate-hint {
                display: block;
            }
        }
    </style>
    <link rel="icon" href="data:,">
    <script src="//cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="./js/globals.js"></script>
    <script type="module" src="./js/main.js"></script>
</head>

<body>
    <div id="game"></div>
    <p class="rotate-hint">For larger controls, turn your phone sideways.</p>
</body>

</html>
